name: Deploy to Prod

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "deploy" to confirm production deployment'
        required: true

permissions:
  contents: write

jobs:
  deploy-prod:
    runs-on: ubuntu-latest
    if: github.event.inputs.confirm == 'deploy'
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Login to Supabase
        run: supabase login --experimental
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      # Step 1: Link to dev to check its state
      - name: Link to dev project
        run: supabase link --project-ref qibssimzuhusvutubbey
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      # Step 2: Get dev's migration versions
      - name: Get dev migration versions
        id: dev-migrations
        run: |
          DEV_VERSIONS=$(supabase migration list --linked --output-format json | jq -r '.migrations[].remote // empty' | sort | tr '\n' ' ')
          echo "versions=$DEV_VERSIONS" >> "$GITHUB_OUTPUT"
          echo "Dev migration versions:"
          echo "$DEV_VERSIONS"

      # Step 3: Link to prod
      - name: Link to prod project
        run: supabase link --project-ref xkrszbmmdaorivkatvwh
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      # Step 4: Get prod's migration versions
      - name: Get prod migration versions
        id: prod-migrations
        run: |
          PROD_VERSIONS=$(supabase migration list --linked --output-format json | jq -r '.migrations[].remote // empty' | sort | tr '\n' ' ')
          echo "versions=$PROD_VERSIONS" >> "$GITHUB_OUTPUT"
          echo "Prod migration versions:"
          echo "$PROD_VERSIONS"

      # Step 5: Compare and sync migration history
      - name: Sync migration history from dev to prod
        run: |
          DEV_VERSIONS="${{ steps.dev-migrations.outputs.versions }}"
          PROD_VERSIONS="${{ steps.prod-migrations.outputs.versions }}"
          
          echo "Comparing migration versions..."
          
          # Convert space-separated to newline-separated for comm
          DEV_LINES=$(echo "$DEV_VERSIONS" | tr ' ' '\n' | sort)
          PROD_LINES=$(echo "$PROD_VERSIONS" | tr ' ' '\n' | sort)
          
          # Find migrations in dev but not in prod (need to be applied)
          MISSING_IN_PROD=$(comm -23 <(echo "$DEV_LINES") <(echo "$PROD_LINES"))
          
          # Find migrations in prod but not in dev (need to be reverted)
          EXTRA_IN_PROD=$(comm -13 <(echo "$DEV_LINES") <(echo "$PROD_LINES"))
          
          if [ -n "$MISSING_IN_PROD" ]; then
            echo "Migrations missing in prod (will be applied):"
            echo "$MISSING_IN_PROD"
          fi
          
          if [ -n "$EXTRA_IN_PROD" ]; then
            echo "Extra migrations in prod (will be reverted):"
            echo "$EXTRA_IN_PROD"
            # Revert extra migrations
            for version in $EXTRA_IN_PROD; do
              echo "Reverting migration $version..."
              supabase migration repair --status reverted "$version" || true
            done
          fi
          
          # Apply missing migrations
          if [ -n "$MISSING_IN_PROD" ]; then
            echo "Applying missing migrations..."
            supabase db push --include-all || true
          fi
          
          echo "Migration history synced!"

      # Step 6: Deploy Edge Functions (same code as dev)
      # ⚠️ 先登录 ghcr.io：`supabase functions deploy` 会在本地用 Docker 拉
      # `ghcr.io/supabase/edge-runtime`，匿名拉取按**出口 IP** 限流（GitHub 托管 runner
      # 是共享 IP），实测以 `toomanyrequests ... allowed: 44000/minute` 稳定失败 ——
      # 整个 prod 部署就断在这一步，migration 已应用而函数没更新。登录后按账号计数。
      # `continue-on-error`：登录失败就退回匿名拉取（等于今天的行为），不因此挡住部署。
      - name: Login to GHCR
        continue-on-error: true
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy edge functions to prod
        run: |
          cd supabase
          for fn in functions/*/; do
            name=$(basename "$fn")
            # `_` 开头的是共享代码目录（如 _shared/），不是函数：它没有 index.ts，
            # 部署必然失败——而本循环不像 sync-dev 那样收集失败继续跑，一个失败就会
            # 让整个 prod 部署中断。共享代码由 import 它的函数各自打包进去。
            case "$name" in _*) echo "跳过共享目录 $name"; continue;; esac
            echo "Deploying $name..."
            supabase functions deploy "$name" --no-verify-jwt
          done

      # Step 7: Generate types from prod
      - name: Generate types from prod
        run: supabase gen types typescript --schema public > types/database.types.ts

      # Step 8: Commit updated types
      - name: Commit updated types
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add types/database.types.ts
          if git diff --cached --quiet; then
            echo "No type changes to commit"
          else
            git commit -m "chore: update types from prod [skip ci]"
            git push
          fi

      # Step 9: 同步类型到 pkuso-mp 的 **main**（稳定线）
      #
      # ⚠️ 目标分支是 `main` 而不是 `dev`，这是 2026-09-29 定的规矩：**类型的来源必须
      # 与那条线指向的环境一致**。mp 是两条线并行的仓库：
      #   - `dev`（开发线）= 开发库 ⇒ 由 sync-dev.yml 写 **dev** 类型
      #   - `main`（稳定线）= 已发布 = 生产库 ⇒ 由本步写 **prod** 类型
      # 在这之前两个 workflow 都往 `dev` 写、commit message 还完全一样，等于同一个文件
      # 有两个写入者、内容来自两个环境，事后无法分辨来源。
      #
      # 推 `main` 会被 mp 自己的 deploy-prod workflow 看到，但提交信息带 `[skip ci]`，
      # GitHub 会原生跳过（mp 的版本号回写也靠同一条机制）。
      #
      # ⚠️ 本步原先用 peter-evans/create-pull-request 的 `repository` 入参开跨仓 PR，但该 action
      # **不支持这个入参**（只能在已 checkout 的仓库里开 PR），且仓库名 pkuso-miniprogram 已更名为
      # pkuso-mp ⇒ 两个原因叠加，该步长期**静默无效**（无文件匹配 → 不开 PR → 步骤照样 success）。
      # 详见 #51。此处改用 sync-dev.yml 里已验证过的直推写法。
      - name: Sync types to miniprogram (main)
        env:
          GH_TOKEN: ${{ secrets.CROSS_REPO_TOKEN }}
        run: |
          REPO="PKUSO-WebApp/pkuso-mp"
          CLONE_DIR=$(mktemp -d)

          git clone --depth=1 --branch main https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git "$CLONE_DIR"
          cd "$CLONE_DIR"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          mkdir -p src/types
          # 本仓库类型在 types/（无 src/ 前缀），直接从这里取——sync-dev 那套 src/types 中转
          # 只服务于它自己的拷贝步骤，这里不需要
          cp "${{ github.workspace }}/types/database.types.ts" src/types/database.types.ts
          git add src/types/database.types.ts

          if git diff --cached --quiet; then
            echo "No changes to commit in miniprogram"
            exit 0
          fi

          git commit -m "chore: sync database types from pkuso-backend [skip ci]"
          git push origin main

      # Step 10: **不往 pkuso-web 写类型**（2026-09-29 移除）。
      #
      # 这里原本也往 pkuso-web 的 `main` 写一份 **prod** 生成类型。但 web 没有 dev 分支
      # ——它是单线、合并即部署，而 `main` 上装的必须是 **dev** 类型：否则「先写前端代码、
      # 再用后端新列」会死锁（PR 的 tsc 会失败，手动补类型又会被 gen-types-check 拒掉）。
      # 所以 web 的类型由 sync-dev.yml 独家写，`ci.yml` 的 gen-types-check 也比对 dev。
      #
      # 两边都写会造成：同一个文件被 prod 类型覆盖 → 下一次 CI 的 gen-types-check（比对 dev）
      # 必然变红，且这个红毫无意义。实测 2026-09-27 run 36312148142 就是这一类。
      #
      # ⚠️ 要恢复本步，必须同时把 pkuso-web 的 gen-types-check 改成比对 prod，
      # 并且接受上面那条死锁 —— 也就是说基本不该恢复。
