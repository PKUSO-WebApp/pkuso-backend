name: Functions Test

# 为什么需要这个文件：**后端的函数测试此前根本不在 CI 里跑**。
# sync-dev.yml 只做 db push → 部署函数 → 同步类型，deploy-prod.yml 是同一条路，
# audit-check.yml 只查 audit/ 目录。于是 supabase/functions/ 下的回归保护
# 全靠「有人记得在本地跑 deno test」—— 而那正是最容易不发生的事。
#
# `deno test --allow-env --allow-read supabase/functions/` 全绿；**测试自身不发起网络调用、
# 不需要任何密钥**（它们桩掉了 fetch；不过首跑仍要从 deno.land 取 std 断言库）。
# ⚠️ **必须带 --allow-env**：不带的话若干 index.test.ts 会因取不到 env 权限直接 error
#（自己跑一次不带 flag 的就知道当下有几个 —— 别把计数写进注释，它会腐烂）。
# ⚠️ **必须带 --allow-read**：`entry-guard.test.ts` 要读各函数的 `index.ts` 源码 ——
# 入口文件按设计没法被 import 进测试（顶层 serve() 会绑端口），所以它没有运行时覆盖，
# 只能靠静态检查兜住（那条守卫就是这么发现 segment-parts 漏 import serve 的）。

on:
  # ⚠️ 这里**故意不加 `paths` 过滤**（2026-09-30 去掉）。
  #
  # 原来的过滤只有 `supabase/functions/**` 与 `scripts/**`，于是**改 migration 的 PR
  # 一次都不跑** —— 2026-09-29 那两条改**生产 RLS 权限**的 migration PR（#71 / #72）
  # 在 CI 上就是零检查。路径过滤在这里省下的是几秒钟，赔掉的是唯一的机器信号。
  #
  # 原来那条注释担心的是「改这个 workflow 或 `scripts/` 时一次都不会跑」，那是**同一个病**：
  # 把「要不要检查」交给一份手写的路径清单，清单漏一项就静默不查
  # （实测过：PR #64 改 workflow 与文档，四条 workflow 一个都没触发）。
  # **去掉过滤 = 没有可漏的清单。** 代价是文档 PR 也会跑一次（约 8 秒）。
  #
  # 配套：规则集里把 `deno-test` 设成必需检查。**顺序不能反** —— 先加必需检查、
  # 后去掉过滤的话，那期间所有 migration PR 会被一个永不出现的检查卡死。
  pull_request:
  push:
    branches: [main]

jobs:
  deno-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      # 闸门的唯一定义在 scripts/gate.sh（内容就是下面那条 deno test）。
      # 以前命令只写在这里，仓库里没有本地闸门对应的东西，于是 AGENTS/CLAUDE.md
      # 只能靠散文说「记得跑 deno test」。现在 CI 与人调的是同一个文件。
      - name: Run function tests
        run: bash scripts/gate.sh
