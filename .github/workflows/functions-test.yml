name: Functions Test

# 为什么需要这个文件：**后端的函数测试此前根本不在 CI 里跑**。
# sync-dev.yml 只做 db push → 部署函数 → 同步类型，deploy-prod.yml 是同一条路，
# audit-check.yml 只查 audit/ 目录。于是 supabase/functions/ 下的回归保护
# 全靠「有人记得在本地跑 deno test」—— 而那正是最容易不发生的事。
#
# `deno test --allow-env supabase/functions/` 全绿；**测试自身不发起网络调用、不需要任何密钥**
# （它们桩掉了 fetch；不过首跑仍要从 deno.land 取 std 断言库）。
# ⚠️ **必须带 --allow-env**：不带的话若干 index.test.ts 会因取不到 env 权限直接 error
#（自己跑一次不带 flag 的就知道当下有几个 —— 别把计数写进注释，它会腐烂）。

on:
  pull_request:
    paths:
      - 'supabase/functions/**'
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'

jobs:
  deno-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Run function tests
        run: deno test --allow-env supabase/functions/
