name: Sync to Dev

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - 'supabase/functions/**'
      - 'supabase/config.toml'
      - '.github/workflows/sync-dev.yml'

permissions:
  contents: write

jobs:
  deploy-dev:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Login to Supabase
        run: supabase login --experimental
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Link to dev project
        run: supabase link --project-ref qibssimzuhusvutubbey
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Apply migrations to dev
        run: supabase db push

      - name: Deploy edge functions to dev
        run: |
          for fn in supabase/functions/*/; do
            name=$(basename "$fn")
            echo "Deploying $name..."
            supabase functions deploy "$name" --no-verify-jwt
          done

      - name: Generate types from dev
        run: supabase gen types typescript --schema public > types/database.types.ts

      - name: Prepare types for frontend repos
        run: mkdir -p src/types && cp types/database.types.ts src/types/database.types.ts

      - name: Commit updated types
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add types/database.types.ts
          if git diff --cached --quiet; then
            echo "No type changes to commit"
          else
            git commit -m "chore: update types from dev [skip ci]"
            git push
          fi

      - name: Create PR in miniprogram
        env:
          GH_TOKEN: ${{ secrets.CROSS_REPO_TOKEN }}
        run: |
          CLONE_DIR=$(mktemp -d)
          git clone --depth=1 https://x-access-token:${GH_TOKEN}@github.com/PKUSO-WebApp/pkuso-mp.git "$CLONE_DIR"
          cd "$CLONE_DIR"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          BRANCH="chore/sync-types-from-backend"
          git checkout -B "$BRANCH"
          mkdir -p src/types
          cp "${{ github.workspace }}/src/types/database.types.ts" src/types/database.types.ts
          git add src/types/database.types.ts
          if git diff --cached --quiet; then
            echo "No changes to commit in miniprogram"
          else
            git commit -m "chore: sync database types from pkuso-backend"
            git push -f origin "$BRANCH"
            gh pr list --repo PKUSO-WebApp/pkuso-mp --head "$BRANCH" --state open --json number | grep -q '"number"' || \
            gh pr create --repo PKUSO-WebApp/pkuso-mp \
              --title "chore: sync database types from pkuso-backend" \
              --body "Auto-generated by pkuso-backend CI. Types generated from dev environment (qibssimzuhusvutubbey)." \
              --head "$BRANCH" --base dev
          fi

      - name: Create PR in web
        env:
          GH_TOKEN: ${{ secrets.CROSS_REPO_TOKEN }}
        run: |
          CLONE_DIR=$(mktemp -d)
          git clone --depth=1 https://x-access-token:${GH_TOKEN}@github.com/PKUSO-WebApp/pkuso-web.git "$CLONE_DIR"
          cd "$CLONE_DIR"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          BRANCH="chore/sync-types-from-backend"
          git checkout -B "$BRANCH"
          mkdir -p src/types
          cp "${{ github.workspace }}/src/types/database.types.ts" src/types/database.types.ts
          git add src/types/database.types.ts
          if git diff --cached --quiet; then
            echo "No changes to commit in web"
          else
            git commit -m "chore: sync database types from pkuso-backend"
            git push -f origin "$BRANCH"
            gh pr list --repo PKUSO-WebApp/pkuso-web --head "$BRANCH" --state open --json number | grep -q '"number"' || \
            gh pr create --repo PKUSO-WebApp/pkuso-web \
              --title "chore: sync database types from pkuso-backend" \
              --body "Auto-generated by pkuso-backend CI. Types generated from dev environment (qibssimzuhusvutubbey)." \
              --head "$BRANCH" --base dev
          fi
