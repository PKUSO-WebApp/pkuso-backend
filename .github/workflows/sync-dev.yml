name: Sync to Dev

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - 'supabase/functions/**'
      - 'supabase/config.toml'
      - '.github/workflows/sync-dev.yml'

permissions:
  contents: write

jobs:
  deploy-dev:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Login to Supabase
        run: supabase login --experimental
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Link to dev project
        run: supabase link --project-ref qibssimzuhusvutubbey
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Apply migrations to dev
        run: supabase db push

      # `supabase functions deploy` 会在本地用 Docker 拉 `ghcr.io/supabase/edge-runtime`。
      # 匿名拉取按**出口 IP** 限流（GitHub 托管 runner 是共享 IP），实测会以
      # `toomanyrequests ... allowed: 44000/minute` 稳定失败 —— 部署整条链路就断在这一步。
      # 登录 ghcr.io 后拉取按账号计数，限额高得多。用 GITHUB_TOKEN（public 包只需读）。
      # `continue-on-error`：登录失败就退回匿名拉取（等于今天的行为），不因此挡住部署。
      - name: Login to GHCR
        continue-on-error: true
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy edge functions to dev
        id: deploy-functions
        run: |
          FAILED=""
          for fn in supabase/functions/*/; do
            name=$(basename "$fn")
            # `_` 开头的是共享代码目录（如 _shared/），不是函数——它没有 index.ts，
            # 当成函数部署必然失败。共享代码由 import 它的函数各自打包进去。
            case "$name" in _*) echo "跳过共享目录 $name"; continue;; esac
            echo "::group::Deploying $name"
            if ! supabase functions deploy "$name" --no-verify-jwt 2>&1; then
              echo "::error::Failed to deploy $name"
              FAILED="$FAILED $name"
            fi
            echo "::endgroup"
          done
          if [ -n "$FAILED" ]; then
            echo "deployed_failed=$FAILED" >> "$GITHUB_OUTPUT"
            echo "::warning::Failed to deploy:$FAILED"
          fi

      - name: Generate types from dev
        run: supabase gen types typescript --schema public > types/database.types.ts

      - name: Prepare types for frontend repos
        run: mkdir -p src/types && cp types/database.types.ts src/types/database.types.ts

      - name: Commit updated types
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add types/database.types.ts
          if git diff --cached --quiet; then
            echo "No type changes to commit"
          else
            git commit -m "chore: update types from dev [skip ci]"
            git push
          fi

      - name: Sync types to miniprogram
        env:
          GH_TOKEN: ${{ secrets.CROSS_REPO_TOKEN }}
        run: |
          REPO="PKUSO-WebApp/pkuso-mp"
          CLONE_DIR=$(mktemp -d)

          git clone --depth=1 https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git "$CLONE_DIR"
          cd "$CLONE_DIR"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout dev

          mkdir -p src/types
          cp "${{ github.workspace }}/src/types/database.types.ts" src/types/database.types.ts
          git add src/types/database.types.ts

          if git diff --cached --quiet; then
            echo "No changes to commit in miniprogram"
            exit 0
          fi

          git commit -m "chore: sync database types from pkuso-backend [skip ci]"
          git push origin dev

      # 同步类型到 pkuso-web 的 `main`（**本步是 web 类型的唯一写入者**）
      #
      # web 没有 dev 分支 —— 单线、合并即部署。它的 `main` 上装 **dev** 类型，因为
      # 「先写前端代码、再用后端新列」要求类型先到：装 prod 类型会死锁（PR 的 tsc 失败，
      # 手动补类型又会被 gen-types-check 拒掉）。配套地，pkuso-web 的 `ci.yml`
      # 里 gen-types-check 也比对 **dev schema**。
      #
      # ⚠️ deploy-prod.yml 里那步「Sync types to web」已于 2026-09-29 删除，别加回来：
      # 它写 prod 类型，会把这里的 dev 类型覆盖掉，然后下一次 CI 必然假红。
      - name: Sync types to web
        env:
          GH_TOKEN: ${{ secrets.CROSS_REPO_TOKEN }}
        run: |
          REPO="PKUSO-WebApp/pkuso-web"
          CLONE_DIR=$(mktemp -d)

          git clone --depth=1 https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git "$CLONE_DIR"
          cd "$CLONE_DIR"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout main

          mkdir -p src/types
          cp "${{ github.workspace }}/src/types/database.types.ts" src/types/database.types.ts
          git add src/types/database.types.ts

          if git diff --cached --quiet; then
            echo "No changes to commit in web"
            exit 0
          fi

          git commit -m "chore: sync database types from pkuso-backend [skip ci]"
          git push origin main

      - name: Report deployment status
        if: steps.deploy-functions.outputs.deployed_failed != ''
        run: |
          echo "::warning::Some edge functions failed to deploy:${{ steps.deploy-functions.outputs.deployed_failed }}"
          echo "Check the logs above for details."
