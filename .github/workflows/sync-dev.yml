name: Sync to Dev

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - 'supabase/functions/**'
      - 'supabase/config.toml'
      - '.github/workflows/sync-dev.yml'

permissions:
  contents: write

jobs:
  deploy-dev:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # 不把 GITHUB_TOKEN 的凭据留在 .git/config 里：它推不进 main，
          # 留着反而会和下面用的 PAT 抢（见「Commit updated types」的说明）。
          persist-credentials: false

      - uses: supabase/setup-cli@v3
        with:
          version: latest

      - name: Login to Supabase
        run: supabase login --experimental
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Link to dev project
        run: supabase link --project-ref qibssimzuhusvutubbey
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Apply migrations to dev
        run: supabase db push

      # `supabase functions deploy` 会在本地用 Docker 拉 `ghcr.io/supabase/edge-runtime`。
      # 匿名拉取按**出口 IP** 限流（GitHub 托管 runner 是共享 IP），实测会以
      # `toomanyrequests ... allowed: 44000/minute` 稳定失败 —— 部署整条链路就断在这一步。
      # 登录 ghcr.io 后拉取按账号计数，限额高得多。用 GITHUB_TOKEN（public 包只需读）。
      # `continue-on-error`：登录失败就退回匿名拉取（等于今天的行为），不因此挡住部署。
      - name: Login to GHCR
        continue-on-error: true
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy edge functions to dev
        id: deploy-functions
        run: |
          FAILED=""
          for fn in supabase/functions/*/; do
            name=$(basename "$fn")
            # `_` 开头的是共享代码目录（如 _shared/），不是函数——它没有 index.ts，
            # 当成函数部署必然失败。共享代码由 import 它的函数各自打包进去。
            case "$name" in _*) echo "跳过共享目录 $name"; continue;; esac
            echo "::group::Deploying $name"
            if ! supabase functions deploy "$name" --no-verify-jwt 2>&1; then
              echo "::error::Failed to deploy $name"
              FAILED="$FAILED $name"
            fi
            echo "::endgroup"
          done
          if [ -n "$FAILED" ]; then
            echo "deployed_failed=$FAILED" >> "$GITHUB_OUTPUT"
            echo "::warning::Failed to deploy:$FAILED"
          fi

      - name: Generate types from dev
        run: supabase gen types typescript --schema public > types/database.types.ts

      - name: Prepare types for frontend repos
        run: mkdir -p src/types && cp types/database.types.ts src/types/database.types.ts

      # ⚠️ 推回本仓 main 用的是 CROSS_REPO_TOKEN（PAT），**不是**默认的 GITHUB_TOKEN。
      #
      # main 的 ruleset 要求「必须走 PR + 过 deno-test」，其 bypass 名单只有
      # OrganizationAdmin 和一个 RepositoryRole，**没有 GitHub Actions** —— 而用
      # GITHUB_TOKEN 推 main 的身份正是它，于是被 `GH013 … Changes must be made through
      # a pull request` 拒掉。这条路的代价是**安静**的：只有真有类型差异的运行才红，
      # 没差异的运行照常绿，所以从 2026-09-28 断到 2026-10-07 才被发现
      # （backend main / mp dev / web main 的类型都停在那一天）。
      #
      # 「把 GitHub Actions 加进 bypass」已试过、行不通：GitHub 服务端返回
      # `422 Actor GitHub Actions integration must be part of the ruleset source
      # or owner organization`（org 上没装它，它不作为"安装"存在）。
      #
      # 改用 PAT 的依据：跨仓推 mp / web 用的就是这个 token，而 web 的 main 有同类
      # 规则、9 月那些类型提交照样进去了。**前提**：该 PAT 对本仓库有写权限，且其
      # 所有者在上面的 bypass 名单里（admin 或对应角色）。
      - name: Commit updated types
        env:
          GH_TOKEN: ${{ secrets.CROSS_REPO_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add types/database.types.ts
          if git diff --cached --quiet; then
            echo "No type changes to commit"
          else
            git commit -m "chore: update types from dev [skip ci]"
            git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Sync types to miniprogram
        env:
          GH_TOKEN: ${{ secrets.CROSS_REPO_TOKEN }}
        run: |
          REPO="PKUSO-WebApp/pkuso-mp"
          CLONE_DIR=$(mktemp -d)

          # ⚠️ 必须显式 --branch dev：**浅克隆只取默认分支**，而 pkuso-mp 的默认分支
          # 2026-09-29 已从 dev 改成 main（main 才是「稳定线」的正式默认）。原来那句
          # 裸 clone + `git checkout dev` 因此报
          #     error: pathspec 'dev' did not match any file(s) known to git
          # 而且这个失败**不会自动被发现**：类型同步断了，前端只是悄悄停止收到更新。
          git clone --depth=1 --branch dev https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git "$CLONE_DIR"
          cd "$CLONE_DIR"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          mkdir -p src/types
          cp "${{ github.workspace }}/src/types/database.types.ts" src/types/database.types.ts
          git add src/types/database.types.ts

          if git diff --cached --quiet; then
            echo "No changes to commit in miniprogram"
            exit 0
          fi

          git commit -m "chore: sync database types from pkuso-backend [skip ci]"
          git push origin dev

      # 同步类型到 pkuso-web 的 `main`（**本步是 web 类型的唯一写入者**）
      #
      # web 没有 dev 分支 —— 单线、合并即部署。它的 `main` 上装 **dev** 类型，因为
      # 「先写前端代码、再用后端新列」要求类型先到：装 prod 类型会死锁（PR 的 tsc 失败，
      # 手动补类型又会被 gen-types-check 拒掉）。配套地，pkuso-web 的 `ci.yml`
      # 里 gen-types-check 也比对 **dev schema**。
      #
      # ⚠️ deploy-prod.yml 里那步「Sync types to web」已于 2026-09-29 删除，别加回来：
      # 它写 prod 类型，会把这里的 dev 类型覆盖掉，然后下一次 CI 必然假红。
      - name: Sync types to web
        env:
          GH_TOKEN: ${{ secrets.CROSS_REPO_TOKEN }}
        run: |
          REPO="PKUSO-WebApp/pkuso-web"
          CLONE_DIR=$(mktemp -d)

          # 同上一节的道理：显式写分支，不要依赖「默认分支恰好是 main」。
          # pkuso-web 的默认分支目前就是 main，所以这句现在是对的 —— 但一旦默认分支
          # 再变，裸 clone + `git checkout main` 会与上面那个 dev 的坑一模一样地失败。
          git clone --depth=1 --branch main https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git "$CLONE_DIR"
          cd "$CLONE_DIR"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          mkdir -p src/types
          cp "${{ github.workspace }}/src/types/database.types.ts" src/types/database.types.ts
          git add src/types/database.types.ts

          if git diff --cached --quiet; then
            echo "No changes to commit in web"
            exit 0
          fi

          git commit -m "chore: sync database types from pkuso-backend [skip ci]"
          git push origin main

      - name: Report deployment status
        if: steps.deploy-functions.outputs.deployed_failed != ''
        run: |
          echo "::warning::Some edge functions failed to deploy:${{ steps.deploy-functions.outputs.deployed_failed }}"
          echo "Check the logs above for details."
