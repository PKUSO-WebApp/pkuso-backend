name: Audit Check

on:
  pull_request:
    paths:
      - 'supabase/migrations/**'
      - 'functions/**'

jobs:
  check-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check audit completeness
        run: |
          # Check if any migration or function files were added/modified
          CHANGED_FILES=$(git diff --name-only --diff-filter=AM origin/${{ github.base_ref }}...HEAD)

          MIGRATION_CHANGES=$(echo "$CHANGED_FILES" | grep -c "^supabase/migrations/" || true)
          FUNCTION_CHANGES=$(echo "$CHANGED_FILES" | grep -c "^functions/" || true)

          if [ "$MIGRATION_CHANGES" -gt 0 ] || [ "$FUNCTION_CHANGES" -gt 0 ]; then
            echo "Backend changes detected:"
            echo "  Migrations: $MIGRATION_CHANGES files"
            echo "  Functions: $FUNCTION_CHANGES files"

            # Check if audit directory has corresponding entries
            AUDIT_FILES=$(find audit/ -name "*.md" -not -name "README.md" 2>/dev/null | wc -l)
            echo "  Audit entries: $AUDIT_FILES"

            # Check for MCP operation references in commit messages
            MCP_REFS=$(git log --oneline origin/${{ github.base_ref }}...HEAD | grep -c "apply_migration\|execute_sql\|deploy_edge_function" || true)
            if [ "$MCP_REFS" -gt 0 ]; then
              echo ""
              echo "⚠️  MCP operations detected in commit messages."
              echo "   Please ensure audit files exist in audit/ directory."
              if [ "$AUDIT_FILES" -eq 0 ]; then
                echo "❌ No audit files found. Please add audit entries for MCP operations."
                exit 1
              fi
            fi

            echo "✅ Audit check passed"
          else
            echo "No backend changes detected, skipping audit check"
          fi
